<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Ataya Master - PK Arcade</title>
  <meta name="description" content="Pour from high, build the foam, don't spill.">
  <meta name="theme-color" content="#130b33">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <script src="../assets/theme.js?v=2"></script>
  <link rel="stylesheet" href="../assets/style.css?v=2">
  <style>
    body { overscroll-behavior: none; }
    main { max-width: 640px; }
    .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .stage { position: relative; border: var(--px) solid var(--line); box-shadow: calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--shadow); }
    #cv { width: 100%; height: min(58vh, 460px); display: block; touch-action: none; cursor: grab; image-rendering: pixelated; }
    .gauge { position: absolute; right: 8px; top: 8px; bottom: 8px; width: 46px; pointer-events: none;
             display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end;
             font: .5rem var(--display); color: #f8f0d8; text-shadow: 2px 2px 0 #05021a; }
    .coach { text-align: center; margin: 14px 0 0; min-height: 2.5em; }
    .levels { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
    .levels .btn { font-size: .6rem; padding: 10px 12px; }
    .stars { font: 1.3rem var(--display); color: var(--yellow); letter-spacing: 6px; margin: 4px 0 12px; }
    .stars i { font-style: normal; color: var(--muted); }
    .how { text-align: left; margin: 0 0 6px; }
    .how li { margin-bottom: 4px; }
  </style>
</head>
<body data-title="Ataya Master">
  <main>
    <div class="hud">
      <div class="chip"><small>Foam</small><span id="foamTxt">0%</span><div class="meter"><i id="foamBar"></i></div></div>
      <div class="chip"><small>Tea left</small><span id="teaTxt">100%</span><div class="meter"><i id="teaBar" style="background:var(--yellow)"></i></div></div>
      <div class="chip"><small id="roundTxt">Round 1/3</small><span id="timeTxt">40s</span><div class="meter"><i id="timeBar" style="background:var(--blue)"></i></div></div>
    </div>
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="gauge"><span>High</span><span>Low</span></div>
    </div>
    <p class="coach" id="coach">Hold to pour. Slide up to pour from higher.</p>
  </main>

  <div class="overlay show" id="ov"><div class="panel" id="ovCard"></div></div>

  <script src="../assets/common.js?v=2"></script>
  <script>
  // ---------------------------------------------------------------------------
  // Model
  //   Pouring moves tea from the held glass to the one on the table.
  //   Foam grows with pour height; the stream wobbles more the higher you pour,
  //   and tea that misses the glass is lost. Foam slowly settles.
  //   Reach the round's foam target before time runs out, with enough tea left.
  // ---------------------------------------------------------------------------
  const ROUNDS = [
    { name: "First round", sub: "Lewel: strong and bitter", target: 55, time: 40, wobble: 1.0 },
    { name: "Second round", sub: "The mint goes in", target: 70, time: 40, wobble: 1.2 },
    { name: "Third round", sub: "The sweet one. The foam must be perfect", target: 85, time: 45, wobble: 1.4 },
  ];
  const LEVELS = {
    easy:      { label: "Easy",      wobble: 0.75, time: 12, wind: 0 },
    normal:    { label: "Normal",    wobble: 1.0,  time: 0,  wind: 0 },
    harmattan: { label: "Harmattan", wobble: 1.05, time: 0,  wind: 0.34 },   // dusty wind pushes the stream sideways
  };
  const CAP = 100;                 // tea in a full glass
  const SAFE = 0.55;               // how far the stream can wander before it misses the glass
  const PX = 3;                    // one canvas pixel = 3 screen pixels, for the chunky look
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  let W, H;

  let level = store.get("ataya-level", "normal");
  let g, roundIdx = 0, totalScore = 0, running = false, last = 0;
  const input = { pouring: false, height: 0.35, keyUp: false, keyDown: false, startY: 0, startH: 0 };

  function resize() {
    const r = cv.getBoundingClientRect();
    W = cv.width = Math.round(r.width / PX);
    H = cv.height = Math.round(r.height / PX);
    ctx.imageSmoothingEnabled = false;
  }
  addEventListener("resize", resize);

  function newRound() {
    const R = ROUNDS[roundIdx], L = LEVELS[level];
    g = {
      target: R.target, time: R.time + L.time, wobbleK: R.wobble * L.wobble, wind: L.wind,
      src: 0, tea: [CAP, 0], foam: [0, 0], lost: 0, t: R.time + L.time, phase: 0, wobbleX: 0,
      bubbles: [], drops: [], dust: [], pourTime: 0, clock: 0,
    };
    input.height = 0.35;
  }

  // ---------------------------------------------------------------------------
  // Controls: press and hold to pour; drag up and down to change height.
  // ---------------------------------------------------------------------------
  cv.addEventListener("pointerdown", e => {
    if (!running) return;
    cv.setPointerCapture(e.pointerId);
    input.pouring = true; input.startY = e.clientY; input.startH = input.height;
  });
  cv.addEventListener("pointermove", e => {
    if (!input.pouring) return;
    input.height = clamp(input.startH + (input.startY - e.clientY) / (cv.getBoundingClientRect().height * 0.6), 0, 1);
  });
  const stop = () => { input.pouring = false; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
  addEventListener("keydown", e => {
    if (e.code === "Space") { input.pouring = running; e.preventDefault(); }
    if (e.code === "ArrowUp") { input.keyUp = true; e.preventDefault(); }
    if (e.code === "ArrowDown") { input.keyDown = true; e.preventDefault(); }
  });
  addEventListener("keyup", e => {
    if (e.code === "Space") input.pouring = false;
    if (e.code === "ArrowUp") input.keyUp = false;
    if (e.code === "ArrowDown") input.keyDown = false;
  });

  // ---------------------------------------------------------------------------
  // Pouring sound: filtered noise that gets brighter the higher you pour.
  // ---------------------------------------------------------------------------
  const pourSound = (() => {
    let gain = null, filter = null;
    function init() {
      const a = sfx.context();
      const buf = a.createBuffer(1, a.sampleRate, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
      filter = a.createBiquadFilter(); filter.type = "bandpass"; filter.Q.value = 0.8;
      gain = a.createGain(); gain.gain.value = 0;
      src.connect(filter).connect(gain).connect(a.destination); src.start();
    }
    return {
      set(on, height) {
        if (sfx.muted) { if (gain) gain.gain.value = 0; return; }
        if (!gain) { if (!on) return; try { init(); } catch { return; } }
        gain.gain.value = on ? 0.05 : 0;
        filter.frequency.value = 700 + height * 2600;
      },
    };
  })();

  // ---------------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------------
  function update(dt) {
    if (input.keyUp) input.height = clamp(input.height + dt * 0.7, 0, 1);
    if (input.keyDown) input.height = clamp(input.height - dt * 0.7, 0, 1);

    g.t -= dt; g.clock += dt;
    g.phase += dt * (2.2 + 2.5 * input.height);
    const s = g.src, d = 1 - s;
    // The hand shakes more the higher it is (two sines feel less like a machine than one)
    const shake = (Math.sin(g.phase * 1.7) * 0.6 + Math.sin(g.phase * 3.1 + 1) * 0.4) * input.height * g.wobbleK;
    // Harmattan: slow gusts push the falling stream; more height means more time in the wind
    const gust = g.wind * Math.sin(g.clock * 0.9) * Math.max(0, Math.sin(g.clock * 0.37 + 1)) * (0.4 + input.height);
    g.gust = gust;
    g.wobbleX = shake + gust;

    const pouring = input.pouring && g.tea[s] > 0;
    if (pouring) {
      const rate = 38 + 20 * (1 - input.height);                 // tea per second
      const amt = Math.min(g.tea[s], rate * dt);
      g.tea[s] -= amt;
      const miss = Math.max(0, Math.abs(g.wobbleX) - SAFE);
      const spilt = amt * clamp(miss * 3, 0, 1);
      g.lost += spilt;
      g.tea[d] += amt - spilt;
      // foam travels with the tea, and the impact whips in more air: higher pour, more foam
      const carried = g.foam[s] * (amt / (g.tea[s] + amt));
      g.foam[s] -= carried;
      const foamGain = (amt - spilt) * (0.02 + 0.7 * input.height ** 2);
      g.foam[d] = clamp(g.foam[d] + carried * (1 - spilt / amt) + foamGain, 0, 100);
      g.pourTime += dt;
      if (Math.random() < dt * 30 * input.height) g.bubbles.push({ i: d, x: Math.random(), life: 0.5 + Math.random() * 0.5 });
      if (spilt > 0 && Math.random() < 0.7) g.drops.push({ x: 0, y: 0, vx: (Math.random() - .5) * 60, vy: -30, life: 0.8 });
    }
    pourSound.set(pouring, input.height);
    // swap glasses when the held one is empty and the player lets go
    if (g.tea[s] <= 0.01 && !input.pouring) { g.foam[d] += g.foam[s]; g.foam[s] = 0; g.src = d; sfx.move(); }
    // foam settles (faster when there is a lot of it)
    for (const i of [0, 1]) g.foam[i] = Math.max(0, g.foam[i] - dt * (2.0 + g.foam[i] * 0.035));

    g.bubbles = g.bubbles.filter(b => (b.life -= dt) > 0);
    g.drops = g.drops.filter(p => { p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; return (p.life -= dt) > 0; });
    if (g.wind && Math.random() < dt * 14) g.dust.push({ x: gust > 0 ? -2 : W + 2, y: Math.random() * H * 0.8, life: 3 });
    g.dust = g.dust.filter(p => { p.x += (40 + 160 * Math.abs(gust)) * Math.sign(gust || 1) * dt; return (p.life -= dt) > 0 && p.x > -4 && p.x < W + 4; });

    const foamNow = mainFoam(), teaLeft = 100 * (1 - g.lost / CAP);
    coach(foamNow, pouring);
    if (foamNow >= g.target && !input.pouring) end(true);
    else if (teaLeft < 35) end(false, "Too much tea on the floor.");
    else if (g.t <= 0) end(foamNow >= g.target, "Time is up and the foam is too thin.");
    hud(foamNow, teaLeft);
  }

  // the foam that counts is on the glass holding most of the tea
  function mainFoam() { return g.tea[0] >= g.tea[1] ? g.foam[0] : g.foam[1]; }

  let coachText = "";
  function coach(foamNow, pouring) {
    let t;
    if (pouring && Math.abs(g.wobbleX) > SAFE) t = "Let go! You are spilling.";
    else if (foamNow >= g.target) t = "That's enough foam. Let go to serve it.";
    else if (g.pourTime > 3 && input.height < 0.45) t = "Slide up. Low pours make almost no foam.";
    else if (!pouring && g.pourTime > 0) t = "Wait for the green line, then hold to pour.";
    else t = "Hold to pour. Slide up to pour from higher.";
    if (t !== coachText) document.getElementById("coach").textContent = coachText = t;
  }

  function hud(foamNow, teaLeft) {
    document.getElementById("foamTxt").textContent = `${Math.round(foamNow)}% of ${g.target}%`;
    const fb = document.getElementById("foamBar");
    fb.style.width = clamp(foamNow, 0, 100) + "%";
    fb.style.background = foamNow >= g.target ? "var(--green)" : "var(--red)";
    document.getElementById("teaTxt").textContent = Math.round(teaLeft) + "%";
    document.getElementById("teaBar").style.width = clamp(teaLeft, 0, 100) + "%";
    document.getElementById("timeTxt").textContent = Math.max(0, Math.ceil(g.t)) + "s";
    document.getElementById("timeBar").style.width = clamp(100 * g.t / g.time, 0, 100) + "%";
    document.getElementById("roundTxt").textContent = `Round ${roundIdx + 1}/3`;
  }

  // ---------------------------------------------------------------------------
  // Drawing (all in low-resolution canvas pixels)
  // ---------------------------------------------------------------------------
  const TEA = "#d9861a", TEA_DARK = "#8a4708", FOAM = "#fff3d6", GLASS = "#f8f0d8";

  function glassGeom(i) {
    const gw = Math.round(Math.min(W * 0.2, 34)), gh = Math.round(gw * 1.25);
    const baseY = Math.round(H * 0.86);
    return { cx: Math.round(i === 0 ? W * 0.32 : W * 0.68), baseY, gw, gh, top: baseY - gh };
  }
  const liftY = () => H * 0.1 + (1 - input.height) * H * 0.3;

  function drawGlass(i, held, dx) {
    const G = glassGeom(i);
    ctx.save();
    if (held) {
      ctx.translate(dx, liftY() - G.top);
      ctx.translate(G.cx, G.baseY - G.gh / 2);
      ctx.rotate((i === 0 ? 1 : -1) * (input.pouring && g.tea[i] > 0 ? 1.9 : 0.35));
      ctx.translate(-G.cx, -(G.baseY - G.gh / 2));
    }
    const x0 = G.cx - G.gw / 2, fill = g.tea[i] / CAP;
    const foamH = Math.round((g.foam[i] / 100) * G.gh * 0.45 * Math.min(1, fill * 2.2));
    if (fill > 0.001) {
      const lvl = Math.round(G.baseY - G.gh * 0.9 * fill);
      ctx.fillStyle = TEA; ctx.fillRect(x0 + 1, lvl, G.gw - 2, G.baseY - lvl);
      ctx.fillStyle = TEA_DARK; ctx.fillRect(x0 + 1, G.baseY - Math.min(4, G.baseY - lvl), G.gw - 2, Math.min(4, G.baseY - lvl));
      if (foamH > 0) {
        ctx.fillStyle = FOAM; ctx.fillRect(x0 + 1, lvl - foamH, G.gw - 2, foamH);
        for (let k = 0; k < G.gw - 2; k += 4) ctx.fillRect(x0 + 1 + k, lvl - foamH - 1, 2, 1);   // lumpy top
      }
      ctx.fillStyle = FOAM;
      for (const b of g.bubbles) if (b.i === i) ctx.fillRect(Math.round(x0 + 2 + b.x * (G.gw - 5)), Math.round(lvl - foamH - 2 - (1 - b.life) * 8), 1, 1);
    }
    ctx.fillStyle = GLASS;                                      // glass walls, base and a highlight
    ctx.fillRect(x0, G.top, 1, G.gh); ctx.fillRect(x0 + G.gw - 1, G.top, 1, G.gh);
    ctx.fillRect(x0, G.baseY, G.gw, 2);
    ctx.globalAlpha = .35; ctx.fillRect(x0 + 3, G.top + 3, 1, Math.round(G.gh * 0.55)); ctx.globalAlpha = 1;
    ctx.restore();
    return G;
  }

  function draw() {
    const night = document.documentElement.dataset.theme !== "day";
    ctx.fillStyle = night ? "#1c1150" : "#f7c46c";              // evening wall or afternoon sun
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = night ? "#2a1b6e" : "#f2b04e";
    for (let y = 6; y < H * 0.86; y += 14) for (let x = (y % 28 ? 0 : 10); x < W; x += 20) ctx.fillRect(x, y, 6, 1);   // wall bricks
    ctx.fillStyle = "#6b3f1d"; ctx.fillRect(0, Math.round(H * 0.86) + 2, W, H);    // table
    ctx.fillStyle = "#8a5428"; ctx.fillRect(0, Math.round(H * 0.86) + 2, W, 2);

    const s = g.src, d = 1 - s;
    const Gd = drawGlass(d, false, 0);
    const handX = g.wobbleX * Gd.gw * 0.5;
    const offsetX = (Gd.cx - glassGeom(s).cx) + (s === 0 ? -1 : 1) * Gd.gw * 0.55 + handX;
    drawGlass(s, true, offsetX);

    const lipX = Math.round(Gd.cx + handX), lipY = Math.round(liftY() + Gd.gh * 0.3);
    const landX = Math.round(Gd.cx + g.wobbleX * Gd.gw * 0.9);
    const miss = Math.abs(g.wobbleX) > SAFE;
    const surface = Math.round(Gd.baseY - Gd.gh * 0.9 * (g.tea[d] / CAP));
    const endY = miss ? Gd.baseY + 2 : surface;
    const pouring = input.pouring && g.tea[s] > 0;
    if (running && (pouring || g.tea[s] > 0)) {
      // the stream when pouring; a dotted guide when not (green = safe, red = it would miss)
      ctx.fillStyle = pouring ? TEA : (miss ? "#ff4458" : "#2fe38c");
      for (let y = lipY; y < endY; y++) {
        if (!pouring && (y >> 1) % 2) continue;
        const k = (y - lipY) / Math.max(1, endY - lipY);
        ctx.fillRect(Math.round(lipX + (landX - lipX) * k * k), y, pouring ? 2 : 1, 1);
      }
      ctx.fillStyle = TEA;
      for (const p of g.drops) ctx.fillRect(Math.round(landX + p.x), Math.round(Gd.baseY + p.y), 1, 1);
    }
    ctx.fillStyle = night ? "#b3a6e0" : "#fff7d9";               // harmattan dust
    for (const p of g.dust) ctx.fillRect(Math.round(p.x), Math.round(p.y), 3, 1);

    // height marker on the right-hand gauge
    const gx = W - 6, gy0 = 8, gy1 = H - 10, hy = Math.round(gy1 - input.height * (gy1 - gy0));
    ctx.fillStyle = "rgba(248,240,216,.3)"; ctx.fillRect(gx, gy0, 2, gy1 - gy0);
    ctx.fillStyle = input.height > 0.7 ? "#ff4458" : input.height > 0.4 ? "#ffd23f" : "#2fe38c";
    ctx.fillRect(gx - 3, hy - 1, 8, 3);
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;
    if (running) update(dt);
    if (g) draw();
    requestAnimationFrame(loop);
  }

  // ---------------------------------------------------------------------------
  // Screens
  // ---------------------------------------------------------------------------
  const ov = document.getElementById("ov"), card = document.getElementById("ovCard");
  const stars = n => `<p class="stars">${"★".repeat(n)}<i>${"★".repeat(3 - n)}</i></p>`;

  function showIntro() {
    card.innerHTML = `<h2>Ataya Master</h2>
      <ol class="how">
        <li><b>Hold</b> anywhere to pour.</li>
        <li><b>Slide up</b> to pour from higher. Higher makes more foam, but your hand shakes.</li>
        <li>Pour while the dotted line is <b>green</b>. Let go when it turns red.</li>
        <li>Reach the foam target before the time runs out.</li>
      </ol>
      <div class="levels">${Object.entries(LEVELS).map(([k, v]) =>
        `<button class="btn ${k === level ? "on" : "ghost"}" data-level="${k}">${v.label}</button>`).join("")}</div>
      <p class="muted">Harmattan adds a dusty wind that pushes the tea sideways.</p>
      <button class="btn red" id="go">Start brewing</button>`;
    card.querySelectorAll("[data-level]").forEach(b => b.onclick = () => { level = b.dataset.level; store.set("ataya-level", level); newRound(); showIntro(); });
    document.getElementById("go").onclick = () => { roundIdx = 0; totalScore = 0; startRound(); };
    ov.classList.add("show");
  }

  function startRound() {
    newRound();
    const R = ROUNDS[roundIdx];
    card.innerHTML = `<h2>${R.name}</h2><p>${R.sub}.</p><p>Foam target: <b>${R.target}%</b></p>
      <button class="btn" id="go">Pour</button>`;
    document.getElementById("go").onclick = () => { ov.classList.remove("show"); running = true; };
    ov.classList.add("show");
  }

  function end(ok, why = "") {
    running = false; input.pouring = false; pourSound.set(false, 0);
    const foam = mainFoam(), tea = 100 * (1 - g.lost / CAP);
    const n = ok ? (tea > 90 && g.t > 10 ? 3 : tea > 75 ? 2 : 1) : 0;
    const pts = ok ? Math.round((foam * 2 + tea * 3 + g.t * 5) * (level === "harmattan" ? 1.5 : level === "easy" ? 0.7 : 1)) : 0;
    totalScore += pts;
    const lastRound = roundIdx === ROUNDS.length - 1;
    if (!ok) {
      sfx.lose();
      card.innerHTML = `<h2>Not this time</h2><p>${why}</p>${stars(0)}
        <div class="row" style="justify-content:center"><button class="btn red" id="go">Try again</button>
        <button class="btn ghost" id="menu">Change level</button></div>`;
      document.getElementById("go").onclick = startRound;
      document.getElementById("menu").onclick = showIntro;
    } else if (!lastRound) {
      sfx.ok();
      card.innerHTML = `<h2>Rafet na!</h2>${stars(n)}
        <p>Foam ${Math.round(foam)}%, tea kept ${Math.round(tea)}%, +${pts} points</p>
        <button class="btn green" id="go">Next round</button>`;
      document.getElementById("go").onclick = () => { roundIdx++; startRound(); };
    } else {
      sfx.win(); confetti();
      const key = "ataya-best-" + level, best = Math.max(store.get(key, 0), totalScore);
      store.set(key, best);
      const title = totalScore > 1500 ? "Grand master of ataya" : totalScore > 1200 ? "Real ataya boy" : "Ataya apprentice";
      const text = `Ataya Master (${LEVELS[level].label}): ${totalScore} points. ${title}!\nCan you beat me? ${location.href}`;
      card.innerHTML = `<h2>${title}</h2>${stars(n)}
        <p>All three rounds served. Total <b>${totalScore}</b> points.</p><p class="muted">Your best on ${LEVELS[level].label}: ${best}</p>
        <div class="row" style="justify-content:center">
          <button class="btn green" id="share">Share</button>
          <button class="btn" id="go">Brew again</button>
        </div>`;
      document.getElementById("share").onclick = () => shareText(text);
      document.getElementById("go").onclick = showIntro;
    }
    ov.classList.add("show");
  }

  resize();
  newRound();
  showIntro();
  requestAnimationFrame(loop);
  </script>
</body>
</html>
