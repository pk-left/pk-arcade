<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gambian Name Meanings - PK Arcade</title>
  <meta name="description" content="What does Lamin, Isatou or Kumba mean? Look up Gambian names and make a card.">
  <meta name="theme-color" content="#130b33">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <script src="../assets/theme.js?v=2"></script>
  <link rel="stylesheet" href="../assets/style.css?v=2">
  <style>
    main { max-width: 640px; }
    .search { display: flex; gap: 10px; margin: 4px 0 16px; }
    .search input { flex: 1; font-size: 1.8rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .chips button { font: 1.35rem var(--body); color: var(--ink); background: var(--bg-2); border: 3px solid var(--line); padding: 2px 10px; cursor: pointer; }
    .chips button:hover { background: var(--yellow); color: var(--on-accent); }
    #out { display: none; text-align: center; }
    #cv { width: 100%; max-width: 440px; border: var(--px) solid var(--line); box-shadow: calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--shadow); }
    #miss { display: none; }
    #miss h3 { margin-bottom: 12px; line-height: 1.6; }
  </style>
</head>
<body data-title="Name Meanings">
  <main>
    <p>Type a Gambian first name to see where it comes from and what it means.</p>
    <form class="search" id="f">
      <input id="q" placeholder="Lamin, Isatou, Kumba" autocomplete="off" autocapitalize="words" aria-label="First name">
      <button class="btn">Look up</button>
    </form>
    <div class="chips" id="chips"></div>
    <div id="out">
      <canvas id="cv" width="960" height="1200"></canvas>
      <div class="row" style="justify-content:center;margin-top:18px">
        <button class="btn green" id="share">Share</button>
        <button class="btn" id="save">Save picture</button>
      </div>
    </div>
    <div class="panel" id="miss"></div>
  </main>

  <script src="../assets/common.js?v=2"></script>
  <script src="names.js"></script>
  <script>
    const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z]/g, "");
    const index = new Map();                       // every spelling points at its entry
    for (const n of NAMES) {
      index.set(norm(n[0]), n);
      n[1].split(",").forEach(v => { const k = norm(v); if (k && !index.has(k)) index.set(k, n); });
    }
    const chips = document.getElementById("chips");
    chips.innerHTML = shuffle(NAMES).slice(0, 12).map(n => `<button type="button">${n[0]}</button>`).join("");
    chips.onclick = e => { if (e.target.tagName === "BUTTON") { sfx.click(); lookup(e.target.textContent); } };
    document.getElementById("f").onsubmit = e => { e.preventDefault(); lookup(document.getElementById("q").value); };

    const INKS = [["#241663", "#ffd23f"], ["#8f1226", "#ffd23f"], ["#0f5c36", "#f8f0d8"], ["#1f3fb0", "#ffd23f"], ["#7a3b0c", "#f8f0d8"]];

    function lookup(raw) {
      const typed = raw.trim();
      if (!typed) return;
      document.getElementById("q").value = typed;
      const hit = index.get(norm(typed));
      const out = document.getElementById("out"), miss = document.getElementById("miss");
      history.replaceState(null, "", "#" + encodeURIComponent(typed));
      if (!hit) {
        sfx.bad();
        out.style.display = "none"; miss.style.display = "block";
        miss.innerHTML = `<h3></h3><p>That name isn't in the list yet. If you know what it means, send it in and it will be added.</p>
          <a class="btn" target="_blank" rel="noopener" href="https://github.com/pk-left/pk-arcade/issues/new?title=${encodeURIComponent("Add name: " + typed)}">Suggest this name</a>`;
        miss.querySelector("h3").textContent = `No entry for "${typed}"`;
        return;
      }
      sfx.coin();
      miss.style.display = "none"; out.style.display = "block";
      const display = typed[0].toUpperCase() + typed.slice(1);
      drawCard(display, hit);
      const text = `${display}: ${hit[3]} (${hit[2]})\nLook up your name: ${location.origin}${location.pathname}`;
      document.getElementById("share").onclick = () => shareText(text);
      document.getElementById("save").onclick = () => {
        const a = document.createElement("a");
        a.download = `${display}-meaning.png`;
        a.href = document.getElementById("cv").toDataURL("image/png");
        a.click();
      };
      out.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function drawCard(display, n) {
      const c = document.getElementById("cv"), x = c.getContext("2d"), W = c.width, H = c.height;
      let h = 0; for (const ch of display.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      const [bg, accent] = INKS[h % INKS.length], rand = seededRandom(h);
      x.fillStyle = bg; x.fillRect(0, 0, W, H);
      // a woven strip pattern, different for every name
      const cols = ["#ff4458", "#4f8bff", "#2fe38c", "#ffd23f", "#f8f0d8"];
      for (const y0 of [60, H - 180]) for (let xx = 0; xx < W; xx += 40) for (let yy = 0; yy < 120; yy += 40) {
        x.fillStyle = cols[Math.floor(rand() * cols.length)];
        if (rand() > 0.35) x.fillRect(xx, y0 + yy, 40, 40);
      }
      x.textAlign = "center"; x.fillStyle = "#f8f0d8";
      x.font = "26px 'Press Start 2P'"; x.fillText("The meaning of", W / 2, 290);
      let size = 110;
      x.font = `${size}px 'Press Start 2P'`;
      while (x.measureText(display).width > W - 100 && size > 40) { size -= 6; x.font = `${size}px 'Press Start 2P'`; }
      x.fillStyle = "#05021a"; x.fillText(display, W / 2 + 8, 448);
      x.fillStyle = accent; x.fillText(display, W / 2, 440);
      x.fillStyle = "#f8f0d8"; x.font = "44px 'VT323'"; x.globalAlpha = .85;
      x.fillText(n[2], W / 2, 520); x.globalAlpha = 1;
      x.font = "60px 'VT323'";
      const y = wrap(x, n[3], W / 2, 630, W - 140, 60);
      const variants = [n[0], ...n[1].split(",").map(v => v.trim())].filter(v => norm(v) !== norm(display));
      x.font = "40px 'VT323'"; x.globalAlpha = .8;
      wrap(x, "Also spelled " + variants.join(", "), W / 2, y + 90, W - 180, 42);
      x.globalAlpha = 1;
    }

    function wrap(x, text, cx, y, maxW, lh) {
      let line = "";
      for (const w of text.split(" ")) {
        const t = line ? line + " " + w : w;
        if (x.measureText(t).width > maxW) { x.fillText(line, cx, y); y += lh; line = w; } else line = t;
      }
      x.fillText(line, cx, y);
      return y;
    }

    Promise.all([document.fonts.load("20px 'Press Start 2P'"), document.fonts.load("20px 'VT323'")]).then(() => {
      if (location.hash) lookup(decodeURIComponent(location.hash.slice(1)));
    });
  </script>
</body>
</html>
