<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guess the Place · PK Arcade</title>
  <meta name="description" content="Which Gambian town is this from space?">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/leaflet/leaflet.css">
  <style>
    .status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 600; }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; background: #d8ccb5; display: block; }
    .dots i.cur { background: var(--blue); }
    .dots i.good { background: var(--green); }
    .dots i.bad { background: var(--red); }
    #sat { height: min(62vh, 480px); border-radius: var(--radius); box-shadow: var(--shadow); background: #2a3a2a; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .opt {
      font: 700 1.05rem var(--display); padding: 14px 10px; border-radius: 14px; border: 0; cursor: pointer;
      background: var(--card); box-shadow: var(--shadow); color: var(--ink);
    }
    .opt.right { background: var(--green); color: #fff; }
    .opt.wrong { background: var(--red); color: #fff; }
    .opt:disabled { cursor: default; }
    .hintrow { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; flex-wrap: wrap; }
    .reveal { display: none; margin-top: 14px; }
    .reveal.show { display: block; }
    .reveal .card { display: grid; grid-template-columns: 1fr; gap: 12px; }
    #mini { height: 220px; border-radius: 12px; }
    @media (min-width: 720px) { .reveal .card { grid-template-columns: 1.1fr 1fr; align-items: center; } }
    .final { text-align: center; padding: 30px 10px; }
    .final .big { font: 800 4rem var(--display); line-height: 1; }
    .leaflet-control-attribution { font-size: 9px; }
  </style>
</head>
<body>
  <div class="flag"></div>
  <header class="topbar">
    <a class="back" href="../">← Arcade</a>
    <h1>Guess the Place 🛰️</h1>
  </header>
  <main>
    <div id="game">
      <div class="status">
        <span id="roundLabel">Round 1 of 5</span>
        <span class="dots" id="dots"></span>
        <span>Score: <b id="score">0</b></span>
      </div>
      <div id="sat"></div>
      <div class="hintrow">
        <span class="muted" id="worth">Worth 3 points</span>
        <button class="btn ghost" id="zoomBtn">🔍 Zoom out (−1 point)</button>
      </div>
      <div class="opts" id="opts"></div>
      <div class="reveal" id="reveal">
        <div class="card">
          <div>
            <h3 id="revealTitle" style="margin:0 0 4px"></h3>
            <p id="revealFact" style="margin:0 0 14px"></p>
            <button class="btn" id="nextBtn">Next →</button>
          </div>
          <div id="mini"></div>
        </div>
      </div>
    </div>
    <div class="final card" id="final" style="display:none"></div>
  </main>

  <script src="../assets/common.js"></script>
  <script src="../assets/leaflet/leaflet.js"></script>
  <script src="places.js"></script>
  <script>
    const ROUNDS = 5;
    const ZOOMS = [16, 14, 12];  // start close; each hint zooms out
    const SAT_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
    const SAT_ATTR = "Imagery © Esri, Maxar, Earthstar Geographics";

    const sat = L.map("sat", {
      zoomControl: false, attributionControl: true, dragging: false, scrollWheelZoom: false,
      doubleClickZoom: false, touchZoom: false, boxZoom: false, keyboard: false,
    });
    L.tileLayer(SAT_URL, { attribution: SAT_ATTR, maxZoom: 18 }).addTo(sat);

    let mini = null, miniMarker = null;
    let rounds, round, score, hints, answered;

    function newGame() {
      rounds = shuffle(PLACES).slice(0, ROUNDS).map(p => p.slice());  // copies, so results don't leak between games
      round = 0; score = 0;
      document.getElementById("final").style.display = "none";
      document.getElementById("game").style.display = "";
      startRound();
    }

    function startRound() {
      hints = 0; answered = false;
      const [name, lat, lon] = rounds[round];
      sat.setView([lat, lon], ZOOMS[0], { animate: false });
      document.getElementById("roundLabel").textContent = `Round ${round + 1} of ${ROUNDS}`;
      document.getElementById("score").textContent = score;
      document.getElementById("reveal").classList.remove("show");
      updateWorth();

      // 3 wrong options, preferring places that are not right next door (keeps it fair)
      const others = shuffle(PLACES.filter(p => p[0] !== name));
      const far = others.filter(p => dist(p, rounds[round]) > 6);
      const wrong = (far.length >= 3 ? far : others).slice(0, 3);
      const opts = shuffle([rounds[round], ...wrong]);
      const box = document.getElementById("opts");
      box.innerHTML = "";
      opts.forEach(p => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = p[0];
        b.onclick = () => answer(b, p[0] === name);
        box.appendChild(b);
      });
      drawDots();
    }

    function dist(a, b) {  // km, good enough at this latitude
      const dy = (a[1] - b[1]) * 111, dx = (a[2] - b[2]) * 111 * Math.cos(13.4 * Math.PI / 180);
      return Math.hypot(dx, dy);
    }

    function updateWorth() {
      document.getElementById("worth").textContent = `Worth ${3 - hints} point${3 - hints === 1 ? "" : "s"}`;
      document.getElementById("zoomBtn").disabled = hints >= ZOOMS.length - 1 || answered;
    }

    document.getElementById("zoomBtn").onclick = () => {
      if (hints >= ZOOMS.length - 1) return;
      hints++;
      sat.flyTo(sat.getCenter(), ZOOMS[hints], { duration: .8 });
      updateWorth();
    };

    function answer(btn, correct) {
      if (answered) return;
      answered = true;
      const [name, lat, lon, fact] = rounds[round];
      document.querySelectorAll(".opt").forEach(b => {
        b.disabled = true;
        if (b.textContent === name) b.classList.add("right");
      });
      if (!correct) btn.classList.add("wrong");
      const pts = correct ? 3 - hints : 0;
      score += pts;
      rounds[round].result = correct;
      document.getElementById("score").textContent = score;
      document.getElementById("revealTitle").textContent = correct ? `✅ ${name}! +${pts}` : `❌ It was ${name}`;
      document.getElementById("revealFact").textContent = fact;
      document.getElementById("nextBtn").textContent = round + 1 < ROUNDS ? "Next →" : "See score";
      document.getElementById("reveal").classList.add("show");
      updateWorth();
      drawDots();
      showMini(lat, lon);
      document.getElementById("reveal").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function showMini(lat, lon) {
      if (!mini) {
        mini = L.map("mini", { zoomControl: false, attributionControl: true });
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          { attribution: "© OpenStreetMap", maxZoom: 18 }).addTo(mini);
      }
      setTimeout(() => {
        mini.invalidateSize();
        mini.fitBounds([[13.05, -16.85], [13.85, -13.8]]);
        if (miniMarker) miniMarker.remove();
        miniMarker = L.circleMarker([lat, lon], { radius: 9, color: "#fff", weight: 3, fillColor: "#ce1126", fillOpacity: 1 }).addTo(mini);
      }, 50);
    }

    document.getElementById("nextBtn").onclick = () => {
      round++;
      if (round < ROUNDS) startRound(); else finish();
    };

    function drawDots() {
      document.getElementById("dots").innerHTML = rounds.map((p, i) =>
        `<i class="${p.result === true ? "good" : p.result === false ? "bad" : i === round ? "cur" : ""}"></i>`).join("");
    }

    function finish() {
      const best = store.get("place-best", 0);
      if (score > best) store.set("place-best", score);
      const line = score >= 13 ? "You know the Gambia like a gele-gele driver! 🚐" :
                   score >= 9 ? "Not bad at all - you get around." :
                   score >= 5 ? "Time for a trip upcountry!" : "Did you ever leave your compound? 😅";
      const squares = rounds.map(p => p.result ? "🟩" : "🟥").join("");
      const text = `🛰️ Guess the Place: ${score}/15 ${squares}\n${line}\n${location.href}`;
      const f = document.getElementById("final");
      f.innerHTML = `<div class="big">${score}<span style="font-size:1.6rem">/15</span></div>
        <p style="font-size:1.6rem;margin:.3em 0">${squares}</p>
        <p>${line}</p><p class="muted">Your best: ${Math.max(score, best)}</p>
        <div class="row" style="justify-content:center">
          <button class="btn green" id="shareBtn">Share</button>
          <button class="btn" onclick="newGame()">Play again</button>
        </div>`;
      document.getElementById("shareBtn").onclick = () => shareText(text);
      document.getElementById("game").style.display = "none";
      f.style.display = "";
    }

    newGame();
  </script>
</body>
</html>
